                <input type="number" id="edad" name="edad">
            </div>
            <div>
                <label>Pasatiempos:</label><br>
                <input type="radio" id="deportes" name="p1" value="deporte"> Deportes</label><br>

                <input type="radio" id="dibujo" name="p1" value="dibujo"> Dibujo
            </div>

    </form>
